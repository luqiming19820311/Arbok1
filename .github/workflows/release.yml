name: Release OTA

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify SemVer tag matches package.json and APP_VERSION
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          TAG_VER="${TAG#v}"
          TAG_VER="${TAG_VER#V}"
          PKG_VER=$(node -p "require('./package.json').version")
          APP_VER=$(node -e "const fs=require('fs'); const m=fs.readFileSync('lib/server/updates.ts','utf8').match(/APP_VERSION\s*=\s*\"([^\"]+)\"/); console.log(m ? m[1] : '');")
          echo "Tag: ${TAG} -> ${TAG_VER} | package.json: ${PKG_VER} | APP_VERSION: ${APP_VER}"
          if [ "${TAG_VER}" != "${PKG_VER}" ] || [ "${TAG_VER}" != "${APP_VER}" ]; then
            echo "::error::Version mismatch: tag=${TAG_VER}, package.json=${PKG_VER}, APP_VERSION=${APP_VER}"
            exit 1
          fi
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${TAG_VER}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint, Typecheck, and Test
        run: npm run lint && npx tsc --noEmit && npm test

      - name: Generate OTA manifest (latest.json)
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = {
              name: "Arbok",
              version: process.env.RELEASE_VERSION,
              tag: process.env.RELEASE_TAG,
              repository: process.env.GITHUB_REPOSITORY,
              publishedAt: new Date().toISOString(),
              releaseUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.RELEASE_TAG}`
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      # Desktop packaging note:
      # When Electron / Tauri packaging is enabled, add a macos-latest / windows-latest build job
      # that builds .dmg / .zip / latest-mac.yml and uploads them alongside latest.json below.

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" latest.json --clobber
          else
            gh release create "${RELEASE_TAG}" latest.json \
              --title "Arbok V${RELEASE_VERSION}" \
              --generate-notes
          fi
