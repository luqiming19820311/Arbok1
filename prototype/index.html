              <div style="font-size:11.5px;color:var(--text-tertiary);margin-top:2px;">${state.asrEngine === "cloud" ? "约 1 小时音频仅需数秒，支持中英日自动语种检测" : "约 980 MB · 音频不出 Mac 本机 · Metal 加速"}</div>
            </div>
            <span class="status-chip good">已就绪</span>
          </div>
        `;
      } else {
        pane.innerHTML = `
          <div class="setting-group">
            <label class="form-label">本机核心依赖检测（优先使用内置 sidecar，自动回退 Homebrew）</label>
            <div class="setting-row">
              <div><div style="font-size:13px;font-weight:600;">yt-dlp</div><div class="tabular" style="font-size:11.5px;color:var(--text-tertiary);">/opt/homebrew/bin/yt-dlp · v2026.10.18</div></div>
              <span class="status-chip good">✓ 正常</span>
            </div>
            <div class="setting-row">
              <div><div style="font-size:13px;font-weight:600;">ffmpeg</div><div class="tabular" style="font-size:11.5px;color:var(--text-tertiary);">/opt/homebrew/bin/ffmpeg · v7.1</div></div>
              <span class="status-chip good">✓ 正常</span>
            </div>
            <div class="setting-row">
              <div><div style="font-size:13px;font-weight:600;">SQLite 本地库</div><div class="tabular" style="font-size:11.5px;color:var(--text-tertiary);">~/Library/Application Support/Arbok/arbok.db</div></div>
              <span class="status-chip good">✓ 正常</span>
            </div>
          </div>
        `;
      }
    }

    /* --- Markdown Export --- */
    function buildMarkdown(ep) {
      const epNotes = state.notes.filter(n => n.epId === ep.id);
      const pm = platformMeta(ep.platform);
      let md = `---\ntitle: "${ep.title}"\nsource: ${pm.label}\nchannel: "${ep.channel}"\nurl: ${ep.pageUrl}\nduration: "${formatTime(ep.durationSec)}"\ntags: [Arbok, ${pm.label}]\n---\n\n# ${ep.title}\n\n`;
      if (ep.guide) {
        md += `## 一句话总结\n> ${ep.guide.tldr}\n\n## 章节时间线\n`;
        ep.guide.timeline.forEach(t => {
          md += `- **[${formatTime(t.start)}] ${t.title}**：${t.summary}\n`;
        });
        md += `\n## 核心观点\n`;
        ep.guide.takeaways.forEach(k => { md += `- ${k}\n`; });
        md += `\n`;
      }
      if (epNotes.length) {
        md += `## 个人笔记与摘录\n`;
        epNotes.forEach(n => {
          md += `### [${formatTime(n.ts)}]\n> ${n.quote}\n\n${n.body}\n\n`;
        });
      }
      return md.trim() + "\n";
    }

    function openExportModal() {
      const ep = getCurrentEp();
      document.getElementById("mdPreviewContent").textContent = buildMarkdown(ep);
      openModal("modalExport");
    }

    function copyMarkdown() {
      const txt = document.getElementById("mdPreviewContent").textContent;
      navigator.clipboard?.writeText(txt).catch(() => {});
      showToast("已复制 Markdown，可直接粘贴至 Obsidian / Notion");
      closeModal("modalExport");
    }

    function downloadMarkdownFile() {
      const ep = getCurrentEp();
      const txt = buildMarkdown(ep);
      const blob = new Blob([txt], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${ep.title.slice(0, 32).replace(/[\\/:*?"<>|]/g, "")}.md`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("已开始下载 .md 文件");
    }

    /* =====================================================================
       Theme & Keyboard Shortcuts
       ===================================================================== */
    function setTheme(t) {
      state.theme = t;
      document.documentElement.setAttribute("data-theme", t);
      const icon = document.getElementById("themeIcon");
      if (icon) {
        icon.innerHTML = t === "dark"
          ? `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`
          : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
      }
      if (document.getElementById("modalSettings").classList.contains("open")) {
        renderSettings();
      }
    }

    document.getElementById("btnToggleTheme").onclick = () => setTheme(state.theme === "light" ? "dark" : "light");
    document.getElementById("btnCollapseSidebar").onclick = toggleSidebar;
    document.getElementById("btnOpenAdd").onclick = () => { openModal("modalAdd"); setTimeout(() => document.getElementById("urlInput")?.focus(), 40); };
    document.getElementById("btnOpenSettings").onclick = () => openSettings("general");

    // Backdrop click to close modals
    document.querySelectorAll(".modal-backdrop").forEach(bd => {
      bd.addEventListener("click", (e) => {
        if (e.target === bd) bd.classList.remove("open");
      });
    });

    // Global Keyboard Shortcuts (Matching PRD 4.3)
    window.addEventListener("keydown", (e) => {
      const tag = document.activeElement?.tagName;
      const inInput = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

      if (e.key === "Escape") {
        document.querySelectorAll(".modal-backdrop.open").forEach(m => m.classList.remove("open"));
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") {
        e.preventDefault();
        openModal("modalAdd");
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key === ",") {
        e.preventDefault();
        openSettings("general");
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
        const subInput = document.getElementById("subSearchInput");
        const listInput = document.querySelector(".list-header .search-input");
        if (subInput || listInput) {
          e.preventDefault();
          (subInput || listInput).focus();
        }
        return;
      }

      if (inInput) return;

      if (e.code === "Space") {
        e.preventDefault();
        togglePlay();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        skipBy(e.shiftKey ? -30 : -10);
      } else if (e.key === "ArrowRight") {
        e.preventDefault();
        skipBy(e.shiftKey ? 30 : 10);
      } else if (e.key === "[") {
        cycleSpeed(-1);
      } else if (e.key === "]") {
        cycleSpeed(1);
      } else if (e.key.toLowerCase() === "c" && state.viewMode === "player") {
        cycleSubtitleMode();
      } else if (e.key.toLowerCase() === "a" && state.viewMode === "player") {
        const ep = getCurrentEp();
        if (ep.mediaType === "video") toggleAudioOnly();
      }
    });

    // Boot
    renderAll();
  </script>
</body>
